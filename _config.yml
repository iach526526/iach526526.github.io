# Hexo Configuration
## Docs: https://hexo.io/docs/configuration.html
## Source: https://github.com/hexojs/hexo/

# Site
title: '奕站'
subtitle: "Each's site"
description: '奕站，奕其的個人網站'
# 可能是未來 i18n 內容This is Each Chen. I am a collage student in Taiwan. I am interested in programming and technology. I will share my learning experience and some interesting things on this blog.
keywords: 
  陳奕其
  iach526
  iach
  iach.cc
  奕站
author: iach526
language: zh-tw
timezone: 'Asia/Taipei'

# URL
## Set your site url here. For example, if you use GitHub Page, set url as 'https://username.github.io/project'
url: https://www.iach.cc
permalink: :title/
permalink_defaults:
pretty_urls:
  trailing_index: true # Set to false to remove trailing 'index.html' from permalinks
  trailing_html: true # Set to false to remove trailing '.html' from permalinks

# Directory
source_dir: source
public_dir: public
tag_dir: tags
archive_dir: archives
category_dir: categories
code_dir: downloads/code
i18n_dir: :lang
skip_render:

# Writing
new_post_name: :title.md # File name of new posts
default_layout: post
titlecase: false # Transform title into titlecase
external_link:
  enable: true # Open external links in new tab
  field: site # Apply to the whole site
  exclude: ''
filename_case: 0
render_drafts: false
post_asset_folder: true
relative_link: false
marked:
  prependRoot: true
  postAsset: true
  breaks: false
future: true
syntax_highlighter: highlight.js
highlight:
  line_number: true
  auto_detect: false
  tab_replace: ''
  wrap: true
  hljs: false
prismjs:
  preprocess: true
  line_number: true
  tab_replace: ''

# Home page setting
# path: Root path for your blogs index page. (default = '')
# per_page: Posts displayed per page. (0 = disable pagination)
# order_by: Posts order. (Order by date descending by default)
index_generator:
  path: ''
  per_page: 10
  order_by: -date

# Category & Tag
default_category: uncategorized
category_map:
  好用軟體: good-software
  生活點滴: life
  科技玩物: tech-toy
  資訊科技: tech
  雜談: other-talk
  精選: Featured
tag_map:
  種樹: p-tree
  自架: self-host
  哲學思辨: think
  好駭客: good-hacker
  前端開發: front-end
  字型: font
  電腦周邊: PC
# Metadata elements
## https://developer.mozilla.org/en-US/docs/Web/HTML/Element/meta
meta_generator: true

# Date / Time format
## Hexo uses Moment.js to parse and display date
## You can customize the date format as defined in
## http://momentjs.com/docs/#/displaying/format/
date_format: YYYY-MM-DD
time_format: HH:mm:ss
## updated_option supports 'mtime', 'date', 'empty'
updated_option: 'mtime'

# Pagination
## Set per_page to 0 to disable pagination
per_page: 10
pagination_dir: page

# Include / Exclude file(s)
## include:/exclude: options only apply to the 'source/' folder
include:
exclude:
ignore:

# Extensions
markdown:
  plugins:
    - markdown-it-footnote
## Themes: https://hexo.io/themes/
theme: nexmoe

# Deployment
## Docs: https://hexo.io/docs/one-command-deployment
deploy:
  type: ''
feed:
  type: rss2
  path: rss.xml
  limit: 0 # 最大文章數量
  content: true # 是否顯示內文

# 站內搜尋
jsonContent:
  meta: false
  pages: false
  posts:
    title: true 
    date: false 
    path: true 
    text: true
    raw: false
    content: false
    slug: false
    updated: false
    comments: false
    link: false
    permalink: false
    excerpt: false
    categories: false
    tags: false
sitemap:
  path:
    - sitemap.xml
    - sitemap.txt
  template: ./template/sitemap_template.xml
  template_txt: ./template/sitemap_template.txt
  rel: false
  tags: true
  categories: true